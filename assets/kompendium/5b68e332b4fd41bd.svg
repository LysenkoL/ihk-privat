<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<style>
.bg{fill:#F9F8F7}.title{font:700 40px Arial,sans-serif;fill:#2C2C2B}.subtitle{font:400 20px Arial,sans-serif;fill:#7D7A75}.section{font:700 24px Arial,sans-serif;fill:#2C2C2B}.label{font:700 25px Arial,sans-serif;fill:#2C2C2B}.small{font:400 17px Arial,sans-serif;fill:#5F5C58}.tiny{font:700 15px Arial,sans-serif;fill:#fff}.mono{font:700 26px Consolas,Menlo,monospace;fill:#2C2C2B}.monoSmall{font:700 18px Consolas,Menlo,monospace;fill:#2C2C2B}.card{fill:#fff;stroke:#E6E5E3;stroke-width:2}.net{fill:#E5F2FC;stroke:#2783DE;stroke-width:3}.host{fill:#FBEBDE;stroke:#D5803B;stroke-width:3}.sub{fill:#E8F1EC;stroke:#46A171;stroke-width:3}.bcast{fill:#FCE9E7;stroke:#E56458;stroke-width:3}.tagNet{fill:#2783DE}.tagHost{fill:#D5803B}.tagSub{fill:#46A171}.tagB{fill:#E56458}.arrow{stroke:#7D7A75;stroke-width:5;fill:none;marker-end:url(#arrow)}.dash{stroke:#7D7A75;stroke-width:3;fill:none;stroke-dasharray:8 8}.octet{font:700 28px Consolas,Menlo,monospace;fill:#2C2C2B}.bit{font:400 15px Arial,sans-serif;fill:#7D7A75}</style>
<marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L14,7 L0,14 z" fill="#7D7A75"/></marker>
</defs>
<rect class="bg" width="1400" height="900"/>
<text x="70" y="75" class="title">IPv4-Adresse und Subnetting</text>
<text x="70" y="110" class="subtitle">Netzanteil und Hostanteil erkennen · großes Netz in kleinere Subnetze teilen</text>

<text x="70" y="165" class="section">1. IPv4-Adresse in Netzanteil und Hostanteil trennen</text>
<rect x="90" y="195" width="1220" height="275" rx="20" class="card"/>
<text x="700" y="245" text-anchor="middle" class="mono">192.168.10.25/24</text>
<text x="700" y="278" text-anchor="middle" class="small">/24 bedeutet: die ersten 24 Bit gehören zum Netzanteil, die letzten 8 Bit zum Hostanteil.</text>

<rect x="200" y="320" width="210" height="90" rx="14" class="net"/><text x="305" y="370" text-anchor="middle" class="octet">192</text><text x="305" y="395" text-anchor="middle" class="bit">8 Bit Netz</text>
<rect x="420" y="320" width="210" height="90" rx="14" class="net"/><text x="525" y="370" text-anchor="middle" class="octet">168</text><text x="525" y="395" text-anchor="middle" class="bit">8 Bit Netz</text>
<rect x="640" y="320" width="210" height="90" rx="14" class="net"/><text x="745" y="370" text-anchor="middle" class="octet">10</text><text x="745" y="395" text-anchor="middle" class="bit">8 Bit Netz</text>
<rect x="860" y="320" width="210" height="90" rx="14" class="host"/><text x="965" y="370" text-anchor="middle" class="octet">25</text><text x="965" y="395" text-anchor="middle" class="bit">8 Bit Host</text>

<rect x="295" y="425" width="460" height="38" rx="10" class="tagNet"/><text x="525" y="450" text-anchor="middle" class="tiny">Netzanteil bei /24: 192.168.10</text>
<rect x="850" y="425" width="230" height="38" rx="10" class="tagHost"/><text x="965" y="450" text-anchor="middle" class="tiny">Hostanteil: .25</text>

<path d="M305 485 V535" class="arrow"/><path d="M965 485 V535" class="arrow"/>
<rect x="165" y="535" width="320" height="105" rx="18" class="net"/><text x="325" y="575" text-anchor="middle" class="label">Netzwerkadresse</text><text x="325" y="613" text-anchor="middle" class="monoSmall">192.168.10.0/24</text><text x="325" y="638" text-anchor="middle" class="small">bezeichnet das gesamte Netz</text>
<rect x="805" y="535" width="320" height="105" rx="18" class="host"/><text x="965" y="575" text-anchor="middle" class="label">Hostadresse</text><text x="965" y="613" text-anchor="middle" class="monoSmall">192.168.10.25</text><text x="965" y="638" text-anchor="middle" class="small">Gerät Nummer .25 im Netz</text>

<text x="70" y="705" class="section">2. Subnetting: großes Netz → kleinere Subnetze</text>
<rect x="90" y="735" width="300" height="95" rx="18" class="net"/><text x="240" y="775" text-anchor="middle" class="label">Großes Netz</text><text x="240" y="810" text-anchor="middle" class="monoSmall">192.168.10.0/24</text>
<path d="M400 782 H492" class="arrow"/>
<rect x="520" y="710" width="185" height="80" rx="16" class="sub"/><text x="612" y="743" text-anchor="middle" class="label">Subnetz 1</text><text x="612" y="772" text-anchor="middle" class="monoSmall">.0/26</text>
<rect x="735" y="710" width="185" height="80" rx="16" class="sub"/><text x="827" y="743" text-anchor="middle" class="label">Subnetz 2</text><text x="827" y="772" text-anchor="middle" class="monoSmall">.64/26</text>
<rect x="950" y="710" width="185" height="80" rx="16" class="sub"/><text x="1042" y="743" text-anchor="middle" class="label">Subnetz 3</text><text x="1042" y="772" text-anchor="middle" class="monoSmall">.128/26</text>
<rect x="1165" y="710" width="185" height="80" rx="16" class="sub"/><text x="1257" y="743" text-anchor="middle" class="label">Subnetz 4</text><text x="1257" y="772" text-anchor="middle" class="monoSmall">.192/26</text>
<text x="700" y="860" text-anchor="middle" class="small">Beispiel: 192.168.10.0/24 wird in vier gleich große /26-Subnetze geteilt. Jedes /26 hat 64 Adressen, davon 62 nutzbare Hosts.</text>
</svg>